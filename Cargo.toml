[package]
name = "blackbox-share"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.14"
mime_guess = "2"
dirs = "5"

open = "5"

[target.'cfg(windows)'.dependencies]
muda = "0.15"
tray-icon = "0.19"
