name: Windows Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build Windows x64 and publish release
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release executable
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Assemble release package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}"
          if ("${{ github.ref_type }}" -ne "tag") {
            $version = "manual-${{ github.run_number }}"
          }

          $stage = "dist/Blackbox-Share-$version"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/x86_64-pc-windows-msvc/release/blackbox-share.exe" "$stage/Blackbox-Share.exe"
          Copy-Item "README.md" "$stage/README.md"
          Copy-Item "web" "$stage/web" -Recurse

          @"
          Blackbox Share $version

          Run Blackbox-Share.exe. On first launch, choose the folder used for uploads and downloads.
          The server listens on port 1962.

          Keep the web folder next to the executable. If Windows Firewall asks, allow access only on
          private networks unless you intentionally configured secure remote access.
          "@ | Set-Content -Encoding utf8 "$stage/START-HERE.txt"

          Compress-Archive -Path "$stage/*" -DestinationPath "dist/Blackbox-Share-Windows-x64-$version.zip" -Force

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blackbox-Share-Windows-x64
          path: dist/*.zip
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Blackbox Share ${{ github.ref_name }}
          generate_release_notes: true
          files: dist/*.zip
          fail_on_unmatched_files: true
