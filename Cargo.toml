[package]
name = "blackbox-share"
version = "1.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["multipart"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
rfd = "0.14"
mime_guess = "2"
dirs = "5"
tokio-util = { version = "0.7", features = ["io"] }

open = "5"
argon2 = "0.5"
fs2 = "0.4"
async-stream = "0.3"
tokio-stream = "0.1"
zip = "0.6"
tempfile = "3"
notify = "6"


[target.'cfg(windows)'.dependencies]
muda = "0.15"
tray-icon = "0.19"
